<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST TEAM - WhatsApp Pairing</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }
        /* Liquid Glass Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.desc {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
        }
        .input-group {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 5px 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        .input-group:focus-within {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.3);
        }
        .prefix {
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            margin-right: 8px;
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            padding-right: 10px;
        }
        input[type="text"] {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            width: 100%;
            padding: 10px 0;
        }
        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        #result {
            margin-top: 20px;
            font-size: 15px;
            color: #60a5fa;
            word-break: break-all;
        }
        .owner-info {
            margin-top: 25px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        .owner-info a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 500;
        }
        .owner-info a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <h2>BLAST TEAM Bot</h2>
        <p class="desc">Enter your WhatsApp number with the country code to get your pairing code.</p>
        
        <div class="input-group">
            <span class="prefix">+</span>
            <input type="text" id="phone" placeholder="e.g. 50934946793" autocomplete="off">
        </div>
        <button onclick="getPairCode()">Generate Pairing Code</button>
        
        <div id="result"></div>
        
        <div class="owner-info">
            <p>Bot Owner: <a href="https://wa.me/50934946793" target="_blank">+509 349 46793</a></p>
        </div>
    </div>

    <script>
        async function getPairCode() {
            const phone = document.getElementById('phone').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!phone) {
                resultDiv.innerHTML = "<span style='color:#f87171;'>Please enter a valid phone number!</span>";
                return;
            }
            
            resultDiv.innerHTML = "Generating code, please wait...";
            
            try {
                // Isit la l ap ale chèche kòd la nan API Render ou a (oswa chanje l ak bon lyen an)
                const response = await fetch(`https://knight-bot-paircode.onrender.com/code?number=${phone}`);
                const data = await response.json();
                
                if (data && data.code) {
                    resultDiv.innerHTML = `Your Pairing Code: <br><b style="color:#34d399; font-size:22px; user-select:all; background:rgba(0,0,0,0.3); padding:5px 10px; border-radius:8px; display:inline-block; margin-top:8px;">${data.code}</b>`;
                } else {
                    resultDiv.innerHTML = "<span style='color:#f87171;'>Failed to generate code. Try again later.</span>";
                }
            } catch (error) {
                resultDiv.innerHTML = "<span style='color:#f87171;'>Server error or connection failed!</span>";
            }
        }
    </script>
</body>
</html>
